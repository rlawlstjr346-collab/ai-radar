name: collect

# 매시 정각 수집 → 신규 요약 최대 4개(플랫폼당 2개, 하루 상한 DAILY_SUMMARY_CAP) → 수명 주기 정리
#
# 안전장치: Supabase 시크릿(SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY)이 없으면 아무것도 설치·실행하지 않고
# "건너뜀" 안내만 남긴 채 성공(초록불)으로 끝난다 → 무료 폴백 배포 중에도 매시간 실패 메일이 오지 않는다.
# ANTHROPIC_API_KEY 는 선택: 없으면 수집·저장만 하고 요약은 건너뛴다(run_pipeline.py).
# 수동 실행(workflow_dispatch)에서 dry_run 을 켜면 시크릿 없이도 공개 API 수집·점수만 확인한다.
on:
  schedule:
    - cron: "0 * * * *"         # 1시간마다
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DB/LLM 없이 수집·점수만 확인"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check secrets
        id: gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "mode=dry-run" >> "$GITHUB_OUTPUT"
            echo "수동 dry-run 요청 → DB/LLM 없이 수집·점수만 확인합니다."
          elif [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "::notice title=collect skipped::Supabase 시크릿(SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY)이 없어 이번 수집을 건너뜁니다. 웹은 샘플 데이터로 동작해요."
            echo "### 수집 건너뜀" >> "$GITHUB_STEP_SUMMARY"
            echo "Supabase 시크릿이 없어서 실행하지 않았어요 (정상 종료). Settings → Secrets and variables → Actions 에 넣으면 다음 정각부터 수집합니다." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "mode=run" >> "$GITHUB_OUTPUT"
            if [ -z "$ANTHROPIC_API_KEY" ]; then
              echo "::notice title=summaries skipped::ANTHROPIC_API_KEY 가 없어 수집·저장만 하고 요약은 건너뜁니다."
            fi
          fi
          exit 0

      - uses: actions/checkout@v4
        if: steps.gate.outputs.mode != 'skip'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.mode != 'skip'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install
        if: steps.gate.outputs.mode != 'skip'
        run: pip install -r worker/requirements.txt

      - name: Unit tests
        if: steps.gate.outputs.mode != 'skip'
        working-directory: worker
        run: python -m pytest -q

      - name: Run pipeline
        if: steps.gate.outputs.mode != 'skip'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUMMARY_TOP_N: ${{ vars.SUMMARY_TOP_N || '4' }}
          DAILY_SUMMARY_CAP: ${{ vars.DAILY_SUMMARY_CAP || '96' }}
        run: |
          if [ "${{ steps.gate.outputs.mode }}" = "dry-run" ]; then
            python worker/run_pipeline.py --dry-run
          else
            python worker/run_pipeline.py
          fi
