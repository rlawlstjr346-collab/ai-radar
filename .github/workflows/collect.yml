name: collect

# 매 20분 자동 수집 (X 실시간 연동 매 20분 + GitHub 핫 오픈소스·릴리즈 매 1시간 게이트 + 글로벌 AI 뉴스):
# - Public 저장소 + 무부하 구조:
#   1) 새 기사/실질 변경이 0건이면 커밋을 스킵(No-op)
#   2) web/vercel.json 의 ignoreCommand 로 피드 JSON 만 바뀐 커밋은 Vercel 전체 재빌드를 건너뛰어
#      일일 배포 한도(100회)를 0% 소모하고, Next.js ISR(revalidate: 60) + Raw JSON 원격 fetch 로
#      최대 60초 안에 최신 피드를 즉시 서빙한다.
on:
  schedule:
    - cron: "*/20 * * * *"      # 20분마다 (하루 72회)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DB/LLM/커밋 없이 수집·점수만 확인"
        type: boolean
        default: false
      force_github:
        description: "GitHub 1시간 주기 게이트를 무시하고 즉시 수집"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Decide run mode
        id: gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "mode=dry-run" >> "$GITHUB_OUTPUT"
            echo "수동 dry-run 요청 → DB/LLM/커밋 없이 수집·점수만 확인합니다."
          elif [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "mode=db" >> "$GITHUB_OUTPUT"
            if [ -z "$ANTHROPIC_API_KEY" ]; then
              echo "::notice title=summaries skipped::ANTHROPIC_API_KEY 가 없어 수집·저장만 하고 요약은 건너뜁니다."
            fi
          else
            echo "mode=snapshot" >> "$GITHUB_OUTPUT"
            echo "::notice title=serverless snapshot mode::Supabase 시크릿이 없어 무부하 스냅샷 모드(live-feed.json + planning-feed.json)로 실행합니다."
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install
        run: pip install -r worker/requirements.txt

      - name: Unit tests
        working-directory: worker
        run: python -m pytest -q

      - name: Run pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_GITHUB_COLLECT: ${{ inputs.force_github == true && '1' || '0' }}
          SUMMARY_TOP_N: ${{ vars.SUMMARY_TOP_N || '4' }}
          DAILY_SUMMARY_CAP: ${{ vars.DAILY_SUMMARY_CAP || '96' }}
        run: |
          if [ "${{ steps.gate.outputs.mode }}" = "dry-run" ]; then
            python worker/run_pipeline.py --dry-run
          elif [ "${{ steps.gate.outputs.mode }}" = "db" ]; then
            python worker/run_pipeline.py
          else
            python worker/run_pipeline.py \
              --snapshot-json web/public/live-feed.json \
              --meta-json web/public/live-feed-meta.json \
              --planning-json web/public/data/planning-feed.json
          fi

      - name: Commit and push live snapshot (No-op when 0 new items)
        if: steps.gate.outputs.mode == 'snapshot'
        run: |
          if git diff --quiet -- web/public/live-feed.json web/public/data/planning-feed.json && [ -z "$(git ls-files --others --exclude-standard -- web/public/live-feed.json web/public/data/planning-feed.json)" ]; then
            echo "변경된 기사가 0건이라 커밋을 생략합니다 (No-op)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/live-feed.json
          if [ -f web/public/live-feed-meta.json ]; then
            git add web/public/live-feed-meta.json
          fi
          if [ -f web/public/data/planning-feed.json ]; then
            git add web/public/data/planning-feed.json
          fi
          git commit -m "chore(feed): update live-feed snapshot [skip ci]"
          git pull --rebase --autostash origin main || true
          git push origin main
