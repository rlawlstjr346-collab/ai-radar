name: collect

# 15분 주기 자동 수집 (공개 저장소라 Actions 무료) — 글로벌 뉴스·Substack·X·커뮤니티·GitHub·중국 5대 소스:
# - 새 기사/실질 변경이 0건이면 커밋을 스킵(No-op)
# - 웹은 재배포 없이 브라우저가 60초마다 GitHub Raw live-feed.json 을 조회해 generated_at 이 더 최신이면 즉시 병합
# - GitHub 핫 오픈소스·릴리즈는 API 예의상 내부 1시간 게이트 유지
on:
  schedule:
    - cron: "*/15 * * * *"   # 15분 주기 (하루 96회)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DB/LLM/커밋 없이 수집·점수만 확인"
        type: boolean
        default: false
      force_github:
        description: "GitHub 1시간 주기 게이트를 무시하고 즉시 수집"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Decide run mode
        id: gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "mode=dry-run" >> "$GITHUB_OUTPUT"
            echo "수동 dry-run 요청 → DB/LLM/커밋 없이 수집·점수만 확인합니다."
          elif [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "mode=db" >> "$GITHUB_OUTPUT"
            if [ -z "$ANTHROPIC_API_KEY" ]; then
              echo "::notice title=summaries skipped::ANTHROPIC_API_KEY 가 없어 수집·저장만 하고 요약은 건너뜁니다."
            fi
          else
            echo "mode=snapshot" >> "$GITHUB_OUTPUT"
            echo "::notice title=serverless snapshot mode::Supabase 시크릿이 없어 무부하 스냅샷 모드(live-feed.json + planning-feed.json)로 실행합니다."
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install
        run: pip install -r worker/requirements.txt

      - name: Unit tests
        working-directory: worker
        run: python -m pytest -q

      - name: Run pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 완료 즉시 Cloudflare 엣지 D1 로 반영 (POST /api/live-feed/ingest)
          FEED_INGEST_URL: ${{ vars.FEED_INGEST_URL || 'https://ai-radar.rlawlstjr346.workers.dev/api/live-feed/ingest' }}
          FEED_INGEST_SECRET: ${{ secrets.FEED_INGEST_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_GITHUB_COLLECT: ${{ inputs.force_github == true && '1' || '0' }}
          SUMMARY_TOP_N: ${{ vars.SUMMARY_TOP_N || '4' }}
          DAILY_SUMMARY_CAP: ${{ vars.DAILY_SUMMARY_CAP || '96' }}
          # 15분 크론 1회당 Gemini 호출 상한 (12분 타임아웃·무료 한도 방어, 나머지는 다음 실행이 캐시 이어받음)
          EDITOR_MAX_BATCHES: ${{ vars.EDITOR_MAX_BATCHES || '4' }}
          IMAGE_VISION_MAX: ${{ vars.IMAGE_VISION_MAX || '12' }}
        run: |
          if [ "${{ steps.gate.outputs.mode }}" = "dry-run" ]; then
            python worker/run_pipeline.py --dry-run
          elif [ "${{ steps.gate.outputs.mode }}" = "db" ]; then
            python worker/run_pipeline.py
          else
            python worker/run_pipeline.py \
              --snapshot-json web/public/live-feed.json \
              --meta-json web/public/live-feed-meta.json \
              --planning-json web/public/data/planning-feed.json
          fi

      - name: Back up JSON to Git for downstream (no rebase, conflict-free)
        if: steps.gate.outputs.mode == 'snapshot'
        run: |
          # 하류 연동(DISPENSER·SKILLDOCK)용 Git JSON 백업. rebase 없이: /tmp 백업 → 최신 main 으로 재체크아웃 → 덮어쓰기 커밋.
          # 그 사이 사람이 코드를 푸시해도 피드 3개 파일만 바꾸므로 코드와 충돌할 일이 없다.
          set -euo pipefail
          FILES="web/public/live-feed.json web/public/live-feed-meta.json web/public/data/planning-feed.json"
          mkdir -p /tmp/feed-backup
          for f in $FILES; do mkdir -p "/tmp/feed-backup/$(dirname "$f")"; cp "$f" "/tmp/feed-backup/$f"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --depth=1 origin main
            git checkout -B main origin/main
            for f in $FILES; do cp "/tmp/feed-backup/$f" "$f"; done
            git add $FILES
            if git diff --cached --quiet; then
              echo "변경된 기사가 0건이라 커밋을 생략합니다 (No-op)."
              exit 0
            fi
            git commit -q -m "chore(feed): update live-feed & planning-feed snapshot [skip ci]"
            if git push origin main; then exit 0; fi
            echo "push 경합 — 최신 main 으로 다시 덮어씁니다 ($attempt/3)"
          done
          exit 1
