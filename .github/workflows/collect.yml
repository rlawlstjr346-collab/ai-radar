name: collect

# 매시 정각 수집:
# - Supabase 시크릿(SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY)이 있으면 → DB 적재 + 요약 + TTL 정리
# - 시크릿이 없는 0원 방생 환경이면 → --snapshot-json web/public/live-feed.json 으로 실제 최신 기사 수집 후
#   변경이 1건 이상 있을 때만 web/public/live-feed.json + web/public/live-feed-meta.json 자동 커밋 & main 푸시
#   (Vercel 자동 재배포 트리거 — [skip ci] 미포함, 변경 0건이면 커밋 생략)
# - 수동 실행(workflow_dispatch)에서 dry_run 을 켜면 DB/커밋 없이 수집·점수만 확인
on:
  schedule:
    - cron: "0 * * * *"         # 1시간마다
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DB/LLM/커밋 없이 수집·점수만 확인"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Decide run mode
        id: gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "mode=dry-run" >> "$GITHUB_OUTPUT"
            echo "수동 dry-run 요청 → DB/LLM/커밋 없이 수집·점수만 확인합니다."
          elif [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "mode=db" >> "$GITHUB_OUTPUT"
            if [ -z "$ANTHROPIC_API_KEY" ]; then
              echo "::notice title=summaries skipped::ANTHROPIC_API_KEY 가 없어 수집·저장만 하고 요약은 건너뜁니다."
            fi
          else
            echo "mode=snapshot" >> "$GITHUB_OUTPUT"
            echo "::notice title=serverless snapshot mode::Supabase 시크릿이 없어 방생형 스냅샷 모드(live-feed.json)로 실행합니다."
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install
        run: pip install -r worker/requirements.txt

      - name: Unit tests
        working-directory: worker
        run: python -m pytest -q

      - name: Run pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUMMARY_TOP_N: ${{ vars.SUMMARY_TOP_N || '4' }}
          DAILY_SUMMARY_CAP: ${{ vars.DAILY_SUMMARY_CAP || '96' }}
        run: |
          if [ "${{ steps.gate.outputs.mode }}" = "dry-run" ]; then
            python worker/run_pipeline.py --dry-run
          elif [ "${{ steps.gate.outputs.mode }}" = "db" ]; then
            python worker/run_pipeline.py
          else
            python worker/run_pipeline.py \
              --snapshot-json web/public/live-feed.json \
              --meta-json web/public/live-feed-meta.json
          fi

      - name: Commit and push live snapshot (only when live-feed.json changed)
        if: steps.gate.outputs.mode == 'snapshot'
        run: |
          if git diff --quiet -- web/public/live-feed.json && [ -z "$(git ls-files --others --exclude-standard -- web/public/live-feed.json)" ]; then
            echo "변경된 기사가 없어 커밋을 생략합니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/live-feed.json
          if [ -f web/public/live-feed-meta.json ]; then
            git add web/public/live-feed-meta.json
          fi
          git commit -m "chore(feed): update live-feed snapshot"
          git push origin main
